<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
      .axis { stroke: currentColor; stroke-width: 1.5; opacity: 0.8; }
      .grid { stroke: currentColor; stroke-width: 1; opacity: 0.15; stroke-dasharray: 4 4; }
      .bar-target { fill: currentColor; opacity: 0.3; }
      .bar-final { fill: #0369A1; }
      .text-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: currentColor; }
      .text-val { font-family: 'Archivo', sans-serif; font-size: 24px; font-weight: 600; fill: currentColor; }
      .text-val-accent { font-family: 'Archivo', sans-serif; font-size: 28px; font-weight: 600; fill: #0369A1; }
      .text-axis { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: currentColor; opacity: 0.6; }
      .text-metric { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #0369A1; letter-spacing: 1px; }
      .line-accent { stroke: #0369A1; stroke-width: 1.5; stroke-dasharray: 2 4; }
    </style>
  </defs>
  
  <text x="50" y="40" class="text-label" style="opacity: 0.6;">PERFORMANCE OPTIMIZATION (PEAK FP32 %)</text>

  <!-- Y Axis Labels & Grid -->
  <text x="300" y="80" class="text-axis">0%</text>
  <line x1="300" y1="90" x2="300" y2="280" class="grid" />

  <text x="450" y="80" class="text-axis">10%</text>
  <line x1="450" y1="90" x2="450" y2="280" class="grid" />

  <text x="600" y="80" class="text-axis">20%</text>
  <line x1="600" y1="90" x2="600" y2="280" class="grid" />
  
  <text x="750" y="80" class="text-axis">30%</text>
  <line x1="750" y1="90" x2="750" y2="280" class="grid" />

  <text x="900" y="80" class="text-axis">40%</text>
  <line x1="900" y1="90" x2="900" y2="280" class="grid" />

  <!-- Initial Target Bar -->
  <text x="50" y="145" class="text-label">INITIAL TARGET</text>
  <rect x="300" y="125" width="150" height="30" class="bar-target" />
  <text x="465" y="147" class="text-val">10.0%</text>

  <!-- Final Optimization Bar -->
  <text x="50" y="225" class="text-label">FINAL ACHIEVED</text>
  <rect x="300" y="200" width="462" height="40" class="bar-final" />
  <text x="775" y="228" class="text-val-accent">30.8%</text>

  <!-- Multiplier Annotation -->
  <line x1="450" y1="260" x2="762" y2="260" class="line-accent" />
  <line x1="450" y1="255" x2="450" y2="265" class="line-accent" />
  <line x1="762" y1="255" x2="762" y2="265" class="line-accent" />
  <text x="606" y="275" class="text-metric" style="text-anchor: middle;">3.08&#215; TARGET PERFORMANCE</text>
</svg>
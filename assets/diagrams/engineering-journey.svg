<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
      .axis { stroke: currentColor; stroke-width: 1.5; }
      .tick { stroke: currentColor; stroke-width: 1.5; }
      .text-title { font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 600; fill: currentColor; text-anchor: middle; letter-spacing: 1px; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: currentColor; opacity: 0.6; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- Progression Axis -->
  <line x1="100" y1="100" x2="900" y2="100" class="axis" />
  
  <!-- Node 1 -->
  <line x1="150" y1="85" x2="150" y2="115" class="tick" />
  <text x="150" y="70" class="text-title">FOUNDATIONS</text>
  <text x="150" y="140" class="text-mono">MECHANICAL DESIGN</text>
  
  <!-- Node 2 -->
  <line x1="400" y1="85" x2="400" y2="115" class="tick" />
  <text x="400" y="70" class="text-title">SYSTEMS &amp; HARDWARE</text>
  <text x="400" y="140" class="text-mono">AEROSPACE INTEGRATION</text>
  
  <!-- Node 3 -->
  <line x1="650" y1="85" x2="650" y2="115" class="tick" />
  <text x="650" y="70" class="text-title">COMPUTATION</text>
  <text x="650" y="140" class="text-mono">HPC &amp; GPU ACCELERATION</text>
  
  <!-- Node 4 -->
  <line x1="900" y1="85" x2="900" y2="115" class="tick" />
  <text x="900" y="70" class="text-title">RESEARCH</text>
  <text x="900" y="140" class="text-mono">CFD &amp; SIMULATION</text>
</svg>
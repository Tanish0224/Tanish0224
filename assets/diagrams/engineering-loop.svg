<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 250" width="100%" height="100%">
  <defs>
    <style>
      .text-main { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-anchor: middle; }
      .line { stroke: #cbd5e1; stroke-width: 2; fill: none; }
      .arrow { fill: #94a3b8; }
      .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 4; }
      @media (prefers-color-scheme: dark) {
        .text-main { fill: #f3f4f6; }
        .line { stroke: #475569; }
        .arrow { fill: #64748b; }
        .box { fill: #0f172a; stroke: #334155; }
      }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M 0,0 L 5,3 L 0,6 Z" class="arrow" />
    </marker>
  </defs>

  <!-- Connectors Row 1 (L->R) -->
  <path d="M 170,70 L 205,70" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 350,70 L 385,70" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 530,70 L 565,70" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Connector R1 to R2 (Down) -->
  <path d="M 640,90 L 640,145" class="line" marker-end="url(#arrowhead)"/>

  <!-- Connectors Row 2 (R->L) -->
  <path d="M 570,170 L 535,170" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 390,170 L 355,170" class="line" marker-end="url(#arrowhead)"/>

  <!-- Row 1 -->
  <g transform="translate(100, 70)">
    <rect x="-70" y="-20" width="140" height="40" class="box" />
    <text x="0" y="5" class="text-main">UNDERSTAND</text>
  </g>
  <g transform="translate(280, 70)">
    <rect x="-70" y="-20" width="140" height="40" class="box" />
    <text x="0" y="5" class="text-main">EXPLORE</text>
  </g>
  <g transform="translate(460, 70)">
    <rect x="-70" y="-20" width="140" height="40" class="box" />
    <text x="0" y="5" class="text-main">BUILD / MODEL</text>
  </g>
  <g transform="translate(640, 70)">
    <rect x="-70" y="-20" width="140" height="40" class="box" />
    <text x="0" y="5" class="text-main">ANALYSE</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(640, 170)">
    <rect x="-70" y="-20" width="140" height="40" class="box" />
    <text x="0" y="5" class="text-main">VALIDATE</text>
  </g>
  <g transform="translate(460, 170)">
    <rect x="-70" y="-20" width="140" height="40" class="box" />
    <text x="0" y="5" class="text-main">IMPROVE</text>
  </g>
  <g transform="translate(280, 170)">
    <rect x="-70" y="-20" width="140" height="40" class="box" />
    <text x="0" y="5" class="text-main">GO FURTHER</text>
  </g>
</svg>

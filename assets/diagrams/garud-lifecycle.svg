<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <style>
      .text-node { fill: #1f2937; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-anchor: middle; }
      .path-line { stroke: #cbd5e1; stroke-width: 2; fill: none; stroke-linejoin: bevel; }
      .bar { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .bg-grid { stroke: #f1f5f9; stroke-width: 1; }
      @media (prefers-color-scheme: dark) {
        .text-node { fill: #f3f4f6; }
        .path-line { stroke: #475569; }
        .bar { fill: #0f172a; stroke: #64748b; }
        .bg-grid { stroke: #111827; }
      }
    </style>
  </defs>

  <!-- Background blueprint grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="20" height="20" fill="none" class="bg-grid" />
  </pattern>
  <rect width="500" height="240" fill="url(#grid)" />

  <!-- Orthogonal Connectors -->
  <path d="M 100,32 L 100,67 L 160,67" class="path-line" />
  <path d="M 160,67 L 160,102 L 220,102" class="path-line" />
  <path d="M 220,102 L 220,137 L 280,137" class="path-line" />
  <path d="M 280,137 L 280,172 L 340,172" class="path-line" />
  <path d="M 340,172 L 340,207 L 400,207" class="path-line" />

  <!-- 1 -->
  <rect x="40" y="20" width="120" height="24" class="bar" />
  <text x="100" y="36" class="text-node">CONCEPT</text>

  <!-- 2 -->
  <rect x="100" y="55" width="120" height="24" class="bar" />
  <text x="160" y="71" class="text-node">DESIGN</text>

  <!-- 3 -->
  <rect x="160" y="90" width="120" height="24" class="bar" />
  <text x="220" y="106" class="text-node">ANALYSIS</text>

  <!-- 4 -->
  <rect x="220" y="125" width="120" height="24" class="bar" />
  <text x="280" y="141" class="text-node">FABRICATION</text>

  <!-- 5 -->
  <rect x="280" y="160" width="120" height="24" class="bar" />
  <text x="340" y="176" class="text-node">INTEGRATION</text>

  <!-- 6 -->
  <rect x="340" y="195" width="120" height="24" class="bar" />
  <text x="400" y="211" class="text-node">TESTING</text>
</svg>

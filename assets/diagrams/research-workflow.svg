<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .box { stroke: currentColor; stroke-width: 1.5; fill: none; }
      .box-accent { stroke: #0369A1; stroke-width: 2; fill: none; }
      .path { stroke: currentColor; stroke-width: 1.5; fill: none; opacity: 0.5; }
      .text-title { font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 600; fill: currentColor; letter-spacing: 0.5px; }
      .text-title-accent { font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 600; fill: #0369A1; letter-spacing: 0.5px; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: currentColor; opacity: 0.7; }
    </style>
  </defs>

  <!-- Left Block: TRACE & BASELINE -->
  <text x="50" y="40" class="text-mono">PHASE 1: UNDERSTANDING</text>
  
  <rect x="50" y="60" width="250" height="60" class="box" />
  <text x="65" y="95" class="text-title">EXISTING CODEBASE</text>
  
  <line x1="175" y1="120" x2="175" y2="150" class="path" />
  
  <rect x="50" y="150" width="250" height="60" class="box" />
  <text x="65" y="175" class="text-title">TRACE THE WORKFLOW</text>
  <text x="65" y="195" class="text-mono">inputs &amp; parameters</text>
  
  <line x1="175" y1="210" x2="175" y2="240" class="path" />
  
  <rect x="50" y="240" width="250" height="60" class="box" />
  <text x="65" y="265" class="text-title">ESTABLISH A BASELINE</text>
  <text x="65" y="285" class="text-mono">boundary conditions</text>

  <!-- Flow to Validation -->
  <line x1="300" y1="270" x2="350" y2="270" class="path" />
  <line x1="350" y1="270" x2="350" y2="180" class="path" />
  <line x1="350" y1="180" x2="400" y2="180" class="path" />

  <!-- Center Block: VALIDATION -->
  <text x="400" y="40" class="text-mono">PHASE 2: EXECUTION &amp; VERIFICATION</text>
  <rect x="400" y="60" width="300" height="240" class="box-accent" stroke-dasharray="4 4" />
  
  <text x="420" y="90" class="text-title-accent">VALIDATE AGAINST REFERENCES</text>
  
  <rect x="420" y="110" width="260" height="40" class="box" />
  <text x="435" y="135" class="text-mono">numerical execution</text>

  <line x1="550" y1="150" x2="550" y2="180" class="path" />

  <rect x="420" y="180" width="260" height="40" class="box" />
  <text x="435" y="205" class="text-mono">outputs &amp; post-processing</text>

  <line x1="550" y1="220" x2="550" y2="240" class="path" />

  <rect x="420" y="240" width="260" height="40" class="box" />
  <text x="435" y="265" class="text-mono">reference comparison</text>

  <!-- Flow to Future Work -->
  <line x1="700" y1="180" x2="750" y2="180" class="path" />

  <!-- Right Block: EXTENSION -->
  <text x="750" y="40" class="text-mono">PHASE 3: NOVEL RESEARCH</text>
  
  <rect x="750" y="120" width="200" height="60" class="box" />
  <text x="765" y="155" class="text-title">INVESTIGATE</text>
  
  <line x1="850" y1="180" x2="850" y2="210" class="path" />

  <rect x="750" y="210" width="200" height="60" class="box" />
  <text x="765" y="245" class="text-title">EXTEND</text>

</svg>
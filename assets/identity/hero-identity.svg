<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
      .grid { stroke: currentColor; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.15; }
      .axis { stroke: currentColor; stroke-width: 1; opacity: 0.3; }
      .mark { stroke: currentColor; stroke-width: 1.5; fill: none; }
      .text-title { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 600; fill: currentColor; letter-spacing: 2px; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: currentColor; opacity: 0.6; letter-spacing: 1px; }
    </style>
  </defs>
  
  <!-- Architectural Grid -->
  <line x1="100" y1="100" x2="900" y2="100" class="axis" />
  <line x1="500" y1="40" x2="500" y2="160" class="axis" />
  
  <!-- Registration Marks -->
  <path d="M 90 90 L 100 90 L 100 100 M 100 100 L 100 110 L 90 110" class="mark" />
  <path d="M 910 90 L 900 90 L 900 100 M 900 100 L 900 110 L 910 110" class="mark" />
  <circle cx="500" cy="100" r="4" class="mark" />
  
  <!-- Content -->
  <text x="120" y="85" class="text-mono">SYS.DOMAIN_01</text>
  <text x="120" y="125" class="text-title">AEROSPACE &amp; MECHANICAL</text>
  
  <text x="880" y="85" class="text-mono" text-anchor="end">SYS.DOMAIN_02</text>
  <text x="880" y="125" class="text-title" text-anchor="end">COMPUTATION &amp; RESEARCH</text>
</svg>